services:
  app:
    image: rankit-gpc:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/rankit.sqlite
      BACKUP_DIR: /backups
      AUTO_MIGRATE_DATABASE: "true"
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - rankit_data:/data
      - rankit_backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rankit_data:
  rankit_backups:
